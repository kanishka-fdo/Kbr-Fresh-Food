<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>

  <!-- Circular Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer thin ring -->
    <circle cx="40" cy="40" r="38" fill="#F8FAFC" stroke="#14532D" stroke-width="1.5"/>
    <!-- Inner subtle background -->
    <circle cx="40" cy="40" r="34" fill="#F0FDF4" />
    
    <!-- Stylized Leaf Vector -->
    <path d="M40 18 C 55 18, 62 30, 40 48 C 18 30, 25 18, 40 18 Z" fill="url(#leafGrad)" opacity="0.9"/>
    <path d="M40 48 C 50 48, 55 60, 40 68 C 25 60, 30 48, 40 48 Z" fill="#16A34A" opacity="0.9"/>
    
    <!-- Spice Accents (Cardamom/Cloves abstract) -->
    <circle cx="28" cy="45" r="3" fill="#D97706"/>
    <circle cx="52" cy="35" r="3" fill="#D97706"/>
    <circle cx="48" cy="58" r="4" fill="#B45309"/>
    <circle cx="32" cy="62" r="2.5" fill="#B45309"/>
  </g>

  <!-- Brand Typography -->
  <text x="105" y="55" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#14532D" letter-spacing="-1">KBR Fresh</text>
  
  <!-- Subtitle Typography -->
  <text x="110" y="80" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#16A34A" letter-spacing="3.5">FOODS • SPICES • EXPORTS</text>
</svg>
